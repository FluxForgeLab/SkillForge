[project]
name = "skillforge"
version = "0.1.0"
description = "Compile enterprise runbooks into executable, evaluable Agent Skills"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docker>=7.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "pydantic>=2.9",
    "pypdf>=5.0",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0",
    "uvicorn>=0.32",
    "websockets>=14.0",
]

[project.scripts]
skillforge = "skillforge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skillforge"]

[tool.hatch.build.targets.wheel.force-include]
"skillforge/db/schema.sql" = "skillforge/db/schema.sql"
"skillforge/sandbox/policies/default.yaml" = "skillforge/sandbox/policies/default.yaml"

[project.optional-dependencies]
lancedb = ["lancedb>=0.17", "pyarrow"]

[dependency-groups]
dev = [
    "pytest-asyncio>=0.24",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = true
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"lancedb".msg = "lancedb is only allowed in knowledge/retrieval/backends"
"pyarrow".msg = "pyarrow is only allowed in knowledge/retrieval/backends"
"sqlite3".msg = "sqlite3 is only allowed in skillforge/db and sqlite_fts"

[tool.ruff.lint.per-file-ignores]
"skillforge/db/**" = ["TID251"]
"skillforge/knowledge/retrieval/backends/sqlite_fts.py" = ["TID251"]
"skillforge/evaluator/guard.py" = ["TID251"]
"tests/**" = ["TID251"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"
markers = [
    "integration: needs running ops-lab Docker",
]
