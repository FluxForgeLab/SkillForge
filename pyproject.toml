[project]
name = "skillforge"
version = "0.1.0"
description = "Compile enterprise runbooks into executable, evaluable Agent Skills"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docker>=7.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "pydantic>=2.9",
    "pypdf>=5.0",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0",
    "uvicorn>=0.32",
    "websockets>=14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skillforge"]

[tool.hatch.build.targets.wheel.force-include]
"skillforge/db/schema.sql" = "skillforge/db/schema.sql"

[dependency-groups]
dev = [
    "pytest-asyncio>=0.24",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = true
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"
markers = [
    "integration: needs running ops-lab Docker",
]
