# SkillForge stack.
# vLLM is the dgx profile. API, web, and ops-lab join this file in C10.7.
# On the assigned Spark the weights are already on disk; set SKILLFORGE_VLLM_MODEL_DIR to override.

name: skillforge

services:
  vllm:
    profiles: [dgx]
    image: nvcr.io/nvidia/vllm:26.08-py3
    container_name: skillforge-vllm
    shm_size: 16gb
    gpus: all
    restart: "no"
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_XET: "1"
    volumes:
      - type: bind
        source: ${SKILLFORGE_VLLM_MODEL_DIR:-/home/asus_gx10/models/Qwen3.6-35B-A3B-NVFP4}
        target: /model
        read_only: true
        bind:
          create_host_path: false
    command:
      - vllm
      - serve
      - /model
      - --served-model-name
      - nvidia/Qwen3.6-35B-A3B-NVFP4
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --tensor-parallel-size
      - "1"
      - --trust-remote-code
      - --kv-cache-dtype
      - fp8
      - --attention-backend
      - flashinfer
      - --moe-backend
      - marlin
      - --gpu-memory-utilization
      - "0.4"
      - --max-model-len
      - "32768"
      - --max-num-seqs
      - "1"
      - --max-num-batched-tokens
      - "8192"
      - --enable-chunked-prefill
      - --async-scheduling
      - --enable-prefix-caching
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":3,"moe_backend":"triton"}'
      - --load-format
      - fastsafetensors
      - --reasoning-parser
      - qwen3
      - --tool-call-parser
      - qwen3_xml
      - --enable-auto-tool-choice
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=5).read()
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 240s
