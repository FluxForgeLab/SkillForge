# DGX full stack: docker compose --profile dgx up -d
# vLLM stays on 127.0.0.1:8001. The API uses host networking so the existing
# loopback ops-lab URL and the vLLM port stay valid. The socket is mounted on
# the API only; the sandbox image does not receive it.

name: skillforge

include:
  - demo/ops-lab/docker-compose.yml

services:
  vllm:
    profiles: [dgx]
    image: nvcr.io/nvidia/vllm:26.08-py3
    container_name: skillforge-vllm
    shm_size: 16gb
    gpus: all
    restart: "no"
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_XET: "1"
    volumes:
      - type: bind
        source: ${SKILLFORGE_VLLM_MODEL_DIR:-/home/asus_gx10/models/Qwen3.6-35B-A3B-NVFP4}
        target: /model
        read_only: true
        bind:
          create_host_path: false
    command:
      - vllm
      - serve
      - /model
      - --served-model-name
      - nvidia/Qwen3.6-35B-A3B-NVFP4
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --tensor-parallel-size
      - "1"
      - --trust-remote-code
      - --kv-cache-dtype
      - fp8
      - --attention-backend
      - flashinfer
      - --moe-backend
      - marlin
      - --gpu-memory-utilization
      - "0.4"
      - --max-model-len
      - "32768"
      - --max-num-seqs
      - "1"
      - --max-num-batched-tokens
      - "8192"
      - --enable-chunked-prefill
      - --async-scheduling
      - --enable-prefix-caching
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":3,"moe_backend":"triton"}'
      - --load-format
      - fastsafetensors
      - --reasoning-parser
      - qwen3
      - --tool-call-parser
      - qwen3_xml
      - --enable-auto-tool-choice
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=5).read()
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 240s

  api:
    profiles: [dgx]
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    network_mode: host
    command:
      - uvicorn
      - skillforge.api.main:app
      - --host
      - 127.0.0.1
      - --port
      - "8000"
    environment:
      SKILLFORGE_MODEL_PROFILE: local_vllm
      SKILLFORGE_MODEL_LOCAL_BASE_URL: http://127.0.0.1:8001/v1
      SKILLFORGE_TEMPERATURE: "0"
      SKILLFORGE_API_HOST: 127.0.0.1
      SKILLFORGE_API_PORT: "8000"
      SKILLFORGE_SQLITE_PATH: /app/data/skillforge.db
      SKILLFORGE_OPSLAB_BASE_URL: http://127.0.0.1:8088
      SKILLFORGE_OPSLAB_PROJECT: skillforge
      SKILLFORGE_OPSLAB_NGINX_CONF: /lab/nginx.conf
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./demo/ops-lab/nginx/nginx.conf:/lab/nginx.conf
      - skillforge-data:/app/data
    depends_on:
      vllm:
        condition: service_healthy
      backend:
        condition: service_healthy

  web:
    profiles: [dgx]
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
      args:
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org}
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - api

volumes:
  skillforge-data:
