name: skillforge-lab

services:
  mock-db:
    build: ./mock-db
    environment:
      PORT: "8090"

  backend:
    build: ./backend
    environment:
      PORT: "8080"
      HEALTH_PATH: "/health"
    depends_on:
      - mock-db
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 2s
      retries: 15

  nginx:
    image: nginx:alpine
    ports:
      - "8088:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
